# StudyBuddy backend - local development
# Usage: docker compose up -d
# Public API: api-gateway on GATEWAY_PORT (default 8000). Backend services are internal only.

networks:
  backend:
    name: studybuddy-backend

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: studybuddy-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-studybuddy}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-studybuddy}
      POSTGRES_DB: ${POSTGRES_DB:-studybuddy}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-studybuddy} -d ${POSTGRES_DB:-studybuddy}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - backend

  auth:
    image: golang:1.25-alpine
    working_dir: /app
    volumes:
      - ./:/app
    command: sh -c "go run ./cmd/auth"
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgres://studybuddy:studybuddy@postgres:5432/studybuddy?sslmode=disable}
      AUTH_SERVER_PORT: ${AUTH_SERVER_PORT:-8080}
      JWT_SECRET: ${JWT_SECRET:-dev-secret-change-in-production}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - backend

  users:
    image: golang:1.25-alpine
    working_dir: /app
    volumes:
      - ./:/app
    command: sh -c "go run ./cmd/users"
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgres://studybuddy:studybuddy@postgres:5432/studybuddy?sslmode=disable}
      USERS_SERVER_PORT: ${USERS_SERVER_PORT:-8081}
      JWT_SECRET: ${JWT_SECRET:-dev-secret-change-in-production}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - backend

  courses:
    image: golang:1.25-alpine
    working_dir: /app
    volumes:
      - ./:/app
    command: sh -c "go run ./cmd/courses"
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgres://studybuddy:studybuddy@postgres:5432/studybuddy?sslmode=disable}
      COURSES_SERVER_PORT: ${COURSES_SERVER_PORT:-8082}
      JWT_SECRET: ${JWT_SECRET:-dev-secret-change-in-production}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - backend

  availability:
    image: golang:1.25-alpine
    working_dir: /app
    volumes:
      - ./:/app
    command: sh -c "go run ./cmd/availability"
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgres://studybuddy:studybuddy@postgres:5432/studybuddy?sslmode=disable}
      AVAILABILITY_SERVER_PORT: ${AVAILABILITY_SERVER_PORT:-8083}
      JWT_SECRET: ${JWT_SECRET:-dev-secret-change-in-production}
      POINTS_SERVICE_URL: ${POINTS_SERVICE_URL:-http://points:8087}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:-000102030405060708090a0b0c0d0e0f101112131415161718191a1b1c1d1e1f}
      GCAL_STATE_KEY: ${GCAL_STATE_KEY:-000102030405060708090a0b0c0d0e0f101112131415161718191a1b1c1d1e1f}
      GCAL_REDIRECT_URL: ${GCAL_REDIRECT_URL:-http://localhost:8000/api/v1/availability/gcal/callback}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - backend

  matching:
    image: golang:1.25-alpine
    working_dir: /app
    volumes:
      - ./:/app
    command: sh -c "go run ./cmd/matching"
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgres://studybuddy:studybuddy@postgres:5432/studybuddy?sslmode=disable}
      MATCHING_SERVER_PORT: ${MATCHING_SERVER_PORT:-8084}
      JWT_SECRET: ${JWT_SECRET:-dev-secret-change-in-production}
      REVIEWS_SERVICE_URL: ${REVIEWS_SERVICE_URL:-http://reviews:8086}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - backend

  groups:
    image: golang:1.25-alpine
    working_dir: /app
    volumes:
      - ./:/app
    command: sh -c "go run ./cmd/groups"
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgres://studybuddy:studybuddy@postgres:5432/studybuddy?sslmode=disable}
      GROUPS_SERVER_PORT: ${GROUPS_SERVER_PORT:-8085}
      JWT_SECRET: ${JWT_SECRET:-dev-secret-change-in-production}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      POINTS_SERVICE_URL: ${POINTS_SERVICE_URL:-http://points:8087}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - backend

  reviews:
    image: golang:1.25-alpine
    working_dir: /app
    volumes:
      - ./:/app
    command: sh -c "go run ./cmd/reviews"
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgres://studybuddy:studybuddy@postgres:5432/studybuddy?sslmode=disable}
      REVIEWS_SERVER_PORT: ${REVIEWS_SERVER_PORT:-8086}
      JWT_SECRET: ${JWT_SECRET:-dev-secret-change-in-production}
      JWT_ISSUER: ${JWT_ISSUER:-studybuddy-auth}
      POINTS_SERVICE_URL: ${POINTS_SERVICE_URL:-http://points:8087}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - backend

  points:
    image: golang:1.25-alpine
    working_dir: /app
    volumes:
      - ./:/app
    command: sh -c "go run ./cmd/points"
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgres://studybuddy:studybuddy@postgres:5432/studybuddy?sslmode=disable}
      POINTS_SERVER_PORT: ${POINTS_SERVER_PORT:-8087}
      JWT_SECRET: ${JWT_SECRET:-dev-secret-change-in-production}
      JWT_ISSUER: ${JWT_ISSUER:-studybuddy-auth}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      REVIEWS_SERVICE_URL: ${REVIEWS_SERVICE_URL:-http://reviews:8086}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - backend

  api-gateway:
    image: golang:1.25-alpine
    working_dir: /app
    volumes:
      - ./:/app
    command: ["sh", "-c", "go build -o /tmp/api-gateway ./cmd/api-gateway && exec /tmp/api-gateway"]
    env_file:
      - .env
    environment:
      GATEWAY_PORT: ${GATEWAY_PORT:-8000}
      JWT_SECRET: ${JWT_SECRET:-dev-secret-change-in-production}
      AUTH_SERVICE_URL: http://auth:8080
      USERS_SERVICE_URL: http://users:8081
      COURSES_SERVICE_URL: http://courses:8082
      AVAILABILITY_SERVICE_URL: http://availability:8083
      MATCHING_SERVICE_URL: http://matching:8084
      GROUPS_SERVICE_URL: http://groups:8085
      REVIEWS_SERVICE_URL: http://reviews:8086
      POINTS_SERVICE_URL: http://points:8087
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3000,http://localhost:5173,http://127.0.0.1:3000,http://127.0.0.1:5173}
      RATE_LIMIT_RPM: ${RATE_LIMIT_RPM:-100}
      RATE_LIMIT_AUTH_RPM: ${RATE_LIMIT_AUTH_RPM:-20}
      HEALTH_CHECK_TIMEOUT: ${HEALTH_CHECK_TIMEOUT:-3s}
      SHUTDOWN_TIMEOUT: ${SHUTDOWN_TIMEOUT:-10s}
    depends_on:
      - auth
      - users
      - courses
      - availability
      - matching
      - groups
      - reviews
      - points
    ports:
      - "${GATEWAY_PORT:-8000}:8000"
    networks:
      - backend

  backfill:
    build:
      context: .
      dockerfile: Dockerfile.backfill
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgres://studybuddy:studybuddy@postgres:5432/studybuddy?sslmode=disable}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
    depends_on:
      postgres:
        condition: service_healthy
    profiles:
      - tools
    networks:
      - backend


volumes:
  postgres_data:
